<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/logo.png/mainlogo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/checkout.css">
  <link rel="stylesheet" href="./css/navbar.css">
  <link rel="stylesheet" href="./css/footer.css">
</head>


<body>
  <!--navbar start-->

  <div id="navbar"></div>

  <!--navbar end-->
  <div class="container mt-5">
    <h3 class="mb-4">Secure Checkout</h3>
    <a href="./cart.html" class="back-btn">←Back</a>
    <!-- STEP 1 -->
    <div id="step1" class="card p-4 mb-3">
      <h5>1. Delivery Address</h5>
      <input id="cust_name" class="form-control mb-2" placeholder="Full Name" required>
      <input id="cust_mobile" class="form-control mb-2" placeholder="Mobile Number" required>
      <input id="cust_pincode" class="form-control mb-2" placeholder="Pincode" maxlength="6" required>

      <div class="row">
        <div class="col"><input id="cust_city" class="form-control mb-2" placeholder="City" required></div>
        <div class="col"><input id="cust_state" class="form-control mb-2" placeholder="State" required></div>
      </div>

      <textarea id="cust_address" class="form-control mb-2" placeholder="House No, Street, Area" required></textarea>
      <button id="btnAddress" class="btn btn-primary w-100">Continue</button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="card p-4 mb-3 d-none">
      <h5>2. Payment Method</h5>

      <label class="payment-box">
        <input type="radio" name="pay" value="Cash On Delivery"> Cash On Delivery
      </label>

      <label class="payment-box">
        <input type="radio" name="pay" value="UPI">
        <img src="https://i.imgur.com/8cQb8MZ.png"> UPI (PhonePe / GPay / Paytm)
      </label>

      <button id="btnPayment" class="btn btn-primary w-100 mt-3">Continue</button>
    </div>

    <!-- STEP 3 -->
    <div id="step3" class="card p-4 d-none">
      <h5>3. Order Summary</h5>
      <p>Name: <span id="sname"></span></p>
      <p>Mobile: <span id="smobile"></span></p>
      <p>Address: <span id="saddress"></span></p>
      <p>Payment: <span id="spayment"></span></p>
      <hr>

      <button id="btnPlace" class="btn btn-success w-100">Proceed</button>
    </div>

    <!-- STEP 4 -->
    <div id="step4" class="card p-4 d-none text-center">
      <h5>Scan & Pay</h5>
      <p class="fw-bold text-success">Amount ₹<span id="upiAmount"></span></p>
      <img id="upiQR" width="260">
      <p class="text-muted mt-2">Use PhonePe / Google Pay / Paytm</p>
      <a href="index.html" class="btn btn-success flex-fill buy">Back to Home</a>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const totalAmount = localStorage.getItem("price") || 0;



      btnAddress.onclick = function () {
        let n = cust_name.value.trim(), m = cust_mobile.value.trim(), p = cust_pincode.value.trim(),
          c = cust_city.value.trim(), s = cust_state.value.trim(), a = cust_address.value.trim();

        if (n == "" || m == "" || p == "" || c == "" || s == "" || a == "") { alert("All fields required"); return; }
        if (!/^[6-9]\d{9}$/.test(m)) { alert("Invalid Mobile"); return; }
        if (!/^\d{6}$/.test(p)) { alert("Invalid Pincode"); return; }

        localStorage.setItem("name", n);
        localStorage.setItem("mobile", m);
        localStorage.setItem("pincode", p);
        localStorage.setItem("city", c);
        localStorage.setItem("state", s);
        localStorage.setItem("address", a);

        step1.classList.add("d-none");
        step2.classList.remove("d-none");
      };

      btnPayment.onclick = function () {
        let pay = document.querySelector('input[name="pay"]:checked');
        if (!pay) { alert("Select Payment Method"); return; }
        localStorage.setItem("payment", pay.value);

        step2.classList.add("d-none");
        step3.classList.remove("d-none");

        sname.innerText = localStorage.name;
        smobile.innerText = localStorage.mobile;
        saddress.innerText = `${localStorage.address}, ${localStorage.city}, ${localStorage.state} - ${localStorage.pincode}`;
        spayment.innerText = localStorage.payment;
        ssize.innerText = localStorage.size || "-";
        sqty.innerText = localStorage.qty || "-";
        sprice.innerText = localStorage.price || "0";
      };

      btnPlace.onclick = async function () {
        let pay = localStorage.payment, amt = localStorage.price || 0;

        // Check login
        const token = localStorage.getItem("access");
        if (!token) {
          alert("Please login first!");
          location.href = "login.html";
          return;
        }

        // Get cart items
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        if (cart.length === 0) {
          alert("Cart is empty");
          return;
        }

        if (pay == "Cash On Delivery") {
          try {
            const res = await fetch("http://127.0.0.1:8000/api/orders/place/", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
              },
              body: JSON.stringify({ items: cart })
            });

            if (!res.ok) {
              const err = await res.json();
              alert("Error placing order: " + JSON.stringify(err));
              return;
            }

            const data = await res.json();
            alert("Order Placed Successfully! Order ID: " + data.order_id);
            localStorage.removeItem("cart");
            localStorage.removeItem("price");
            location.href = "index.html";

          } catch (error) {
            console.error(error);
            alert("Failed to connect to server");
          }

        } else {
          // UPI Logic (keep as visual only for now, or implement similar backend call if needed)
          step3.classList.add("d-none");
          step4.classList.remove("d-none");
          upiAmount.innerText = amt;

          let upi = `upi://pay?pa=yourupi@bank&pn=YourStore&am=${amt}&cu=INR`;
          upiQR.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(upi)}`;

          // Note: For real UPI integration, you'd also want to create the order in backend PENDING payment.
          // For simplicity, we only implemented COD backend call above.
        }
      };

      btnPaid.onclick = function () {
        alert("Payment Successful! Order Confirmed.");
        localStorage.clear();
        location.href = "index.html";
      };
    });
  </script>
  <!--footer start-->
  <script src="./js/common.js"></script>

  <!--footer end-->

</body>

</html>
