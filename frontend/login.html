<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login & Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/login.css">
</head>

<body>

  <div class="container">
    <div class="card auth-card">
      <h3 class="text-center mb-3" id="formTitle">Login</h3>

      <!-- LOGIN FORM -->
      <form id="loginForm">

        <!-- USERNAME FIELD -->
        <label for="loginUsername" class="form-label text-start w-100 ps-1">Username</label>
        <input type="text" id="loginUsername" class="form-control mb-2" placeholder="e.g. abc1 (not email)"
          autocomplete="username" required>

        <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Password"
          autocomplete="current-password" required>

        <button type="submit" class="btn btn-primary w-100">
          Login
        </button>

        <p class="text-center mt-3">
          Don’t have an account?
          <a href="#" onclick="showRegister()">Create Account</a>
        </p>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" style="display:none">

        <input type="text" id="firstName" class="form-control mb-2" placeholder="First Name" required>
        <input type="text" id="lastName" class="form-control mb-2" placeholder="Last Name" required>
        <input type="email" id="regEmail" class="form-control mb-2" placeholder="Email" required>
        <input type="password" id="regPassword" class="form-control mb-2" placeholder="Password" required>
        <input type="password" id="confirmPassword" class="form-control mb-2" placeholder="Confirm Password" required>

        <button type="submit" class="btn btn-success w-100">
          Create Account
        </button>

        <p class="text-center mt-3">
          Already have an account?
          <a href="#" onclick="showLogin()">Login</a>
        </p>
      </form>

    </div>
  </div>

  <script src="./js/login.js"></script>
</body>

</html>
